name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Capture all output to build.log so failures can be surfaced as a PR comment.
      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          {
            gradle wrapper --gradle-version 8.9 &&
            ./gradlew --no-daemon assembleDebug --stacktrace
          } 2>&1 | tee build.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dogear-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # On failure, post the tail of the build log to the PR so it can be diagnosed.
      - name: Report build failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch (e) { log = 'no build.log produced'; }
            const lines = log.split('\n');
            const tail = lines.slice(-250).join('\n').slice(-60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### CI build failed\n```\n' + tail + '\n```',
            });
