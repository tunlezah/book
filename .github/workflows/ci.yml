name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The wrapper JAR is a binary and is not committed; regenerate it deterministically.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      # Build the APK first — it is the primary deliverable.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dogear-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew --no-daemon lintDebug --stacktrace
