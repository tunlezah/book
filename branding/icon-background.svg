<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Dogear adaptive icon background">
  <title>Dogear icon background</title>
  <desc>Background layer (full-bleed) for the Android adaptive launcher icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C342A"/>
      <stop offset="1" stop-color="#24201A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>
</svg>
