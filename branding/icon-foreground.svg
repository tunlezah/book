<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Dogear adaptive icon foreground">
  <title>Dogear icon foreground</title>
  <desc>Foreground layer for the Android adaptive launcher icon: the Pup face, scaled and centered into the icon safe zone.</desc>
  <defs>
    <linearGradient id="fpage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E2"/>
      <stop offset="1" stop-color="#F1E4C8"/>
    </linearGradient>
    <linearGradient id="ffold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0AC4A"/>
      <stop offset="1" stop-color="#B9822A"/>
    </linearGradient>
    <linearGradient id="fear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E4C8"/>
      <stop offset="1" stop-color="#E6D3AE"/>
    </linearGradient>
  </defs>

  <!-- Pup art scaled (0.80) and centered to stay within the ~66% safe zone -->
  <g transform="translate(54.4,70.4) scale(0.80)">
    <path d="M180 196 L150 70 L246 168 Z"
          fill="url(#fear)" stroke="#5B4636" stroke-width="13" stroke-linejoin="round"/>
    <rect x="158" y="168" width="196" height="226" rx="26"
          fill="url(#fpage)" stroke="#5B4636" stroke-width="14"/>
    <path d="M278 168 H354 V244 Z"
          fill="url(#ffold)" stroke="#5B4636" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="214" cy="262" r="13" fill="#5B4636"/>
    <circle cx="298" cy="262" r="13" fill="#5B4636"/>
    <ellipse cx="256" cy="318" rx="40" ry="30" fill="#F6ECD6" stroke="#5B4636" stroke-width="10"/>
    <ellipse cx="256" cy="306" rx="15" ry="11" fill="#5B4636"/>
    <path d="M256 317 V332 M256 332 Q236 348 222 334 M256 332 Q276 348 290 334"
          fill="none" stroke="#5B4636" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
