<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Earmark adaptive icon foreground">
  <title>Earmark icon foreground</title>
  <desc>Foreground layer for the Android adaptive launcher icon. Content stays within the safe zone (center ~66%).</desc>
  <defs>
    <linearGradient id="fpage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E2"/>
      <stop offset="1" stop-color="#F2E6CC"/>
    </linearGradient>
    <linearGradient id="ffold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B9822A"/>
    </linearGradient>
  </defs>

  <!-- Adaptive icons: 108dp canvas, ~72dp safe zone. Keep art centered. -->
  <g>
    <path d="M168 150
             h132
             l44 44
             v172
             a14 14 0 0 1 -14 14
             h-162
             a14 14 0 0 1 -14 -14
             v-202
             a14 14 0 0 1 14 -14 z"
          fill="url(#fpage)" stroke="#5B4636" stroke-width="12" stroke-linejoin="round"/>

    <path d="M300 150 l44 44 h-30 a14 14 0 0 1 -14 -14 z"
          fill="url(#ffold)" stroke="#5B4636" stroke-width="12" stroke-linejoin="round"/>

    <g stroke="#5B4636" stroke-width="13" stroke-linecap="round" opacity="0.85">
      <line x1="192" y1="248" x2="296" y2="248"/>
      <line x1="192" y1="288" x2="316" y2="288"/>
      <line x1="192" y1="328" x2="316" y2="328"/>
      <line x1="192" y1="368" x2="262" y2="368"/>
    </g>
  </g>
</svg>
