<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Dogear logo concept B">
  <title>Dogear — concept B (Minimal)</title>
  <desc>A minimal open book whose two top corners read as dog ears: one perked up, one folded over. Two dot eyes and text lines suggest both a snout and a page.</desc>
  <defs>
    <linearGradient id="pageB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E2"/>
      <stop offset="1" stop-color="#F1E4C8"/>
    </linearGradient>
    <linearGradient id="foldB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0AC4A"/>
      <stop offset="1" stop-color="#B9822A"/>
    </linearGradient>
  </defs>

  <!-- Left ear: perked up (corner pulled into a point) -->
  <path d="M150 230 L150 150 Q150 120 188 132 L150 230 Z"
        fill="url(#pageB)" stroke="#5B4636" stroke-width="14" stroke-linejoin="round"/>

  <!-- Page / face body -->
  <path d="M150 168
           q0 -30 36 -22
           h120
           q40 -10 40 22
           v176
           q0 22 -22 22
           h-152
           q-22 0 -22 -22 z"
        fill="url(#pageB)" stroke="#5B4636" stroke-width="14" stroke-linejoin="round"/>

  <!-- Right ear: folded over (the dog-ear) -->
  <path d="M306 146 q40 -10 40 22 v44 z"
        fill="url(#foldB)" stroke="#5B4636" stroke-width="14" stroke-linejoin="round"/>

  <!-- Two dot eyes -->
  <circle cx="206" cy="232" r="12" fill="#5B4636"/>
  <circle cx="290" cy="232" r="12" fill="#5B4636"/>

  <!-- Snout/nose -->
  <ellipse cx="248" cy="280" rx="14" ry="10" fill="#5B4636"/>

  <!-- Text lines (it is still a page) -->
  <g stroke="#5B4636" stroke-width="13" stroke-linecap="round" opacity="0.55">
    <line x1="186" y1="330" x2="312" y2="330"/>
    <line x1="186" y1="360" x2="276" y2="360"/>
  </g>
</svg>
