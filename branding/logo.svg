<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Earmark logo">
  <title>Earmark</title>
  <desc>A book page with a folded top-right corner (a dog-ear bookmark).</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E2"/>
      <stop offset="1" stop-color="#F2E6CC"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A441"/>
      <stop offset="1" stop-color="#B9822A"/>
    </linearGradient>
  </defs>

  <!-- The page -->
  <path d="M120 96
           h208
           l64 64
           v256
           a16 16 0 0 1 -16 16
           h-256
           a16 16 0 0 1 -16 -16
           v-304
           a16 16 0 0 1 16 -16 z"
        fill="url(#page)" stroke="#5B4636" stroke-width="14" stroke-linejoin="round"/>

  <!-- The dog-ear fold (the earmark) -->
  <path d="M328 96 l64 64 h-48 a16 16 0 0 1 -16 -16 z"
        fill="url(#fold)" stroke="#5B4636" stroke-width="14" stroke-linejoin="round"/>

  <!-- Text lines on the page -->
  <g stroke="#5B4636" stroke-width="16" stroke-linecap="round" opacity="0.85">
    <line x1="150" y1="210" x2="300" y2="210"/>
    <line x1="150" y1="260" x2="330" y2="260"/>
    <line x1="150" y1="310" x2="330" y2="310"/>
    <line x1="150" y1="360" x2="270" y2="360"/>
  </g>
</svg>
