<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Dogear logo">
  <title>Dogear</title>
  <desc>A book whose cover is a friendly dog's face: left ear erect, right ear folded over like a dog-eared page.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF3E2"/>
      <stop offset="1" stop-color="#F1E4C8"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0AC4A"/>
      <stop offset="1" stop-color="#B9822A"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1E4C8"/>
      <stop offset="1" stop-color="#E6D3AE"/>
    </linearGradient>
  </defs>

  <!-- Left ear: erect / pointed, rising from the top-left book corner -->
  <path d="M180 196 L150 70 L246 168 Z"
        fill="url(#ear)" stroke="#5B4636" stroke-width="13" stroke-linejoin="round"/>

  <!-- Book body = dog face -->
  <rect x="158" y="168" width="196" height="226" rx="26"
        fill="url(#page)" stroke="#5B4636" stroke-width="14"/>

  <!-- Right ear: folded over (the dog-ear page fold) -->
  <path d="M278 168 H354 V244 Z"
        fill="url(#fold)" stroke="#5B4636" stroke-width="14" stroke-linejoin="round"/>

  <!-- Eyes -->
  <circle cx="214" cy="262" r="13" fill="#5B4636"/>
  <circle cx="298" cy="262" r="13" fill="#5B4636"/>

  <!-- Snout + nose -->
  <ellipse cx="256" cy="318" rx="40" ry="30" fill="#F6ECD6" stroke="#5B4636" stroke-width="10"/>
  <ellipse cx="256" cy="306" rx="15" ry="11" fill="#5B4636"/>
  <!-- Mouth -->
  <path d="M256 317 V332 M256 332 Q236 348 222 334 M256 332 Q276 348 290 334"
        fill="none" stroke="#5B4636" stroke-width="9" stroke-linecap="round"/>
</svg>
